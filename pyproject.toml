[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-mujoco"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["mujoco==3.4.0", "numpy==2.2.6", "trimesh==4.7.4", "Pillow==11.3.0", "pydantic==2.11.7", "PyYAML==6.0.2", "scipy==1.15.3"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "packaging==26.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
